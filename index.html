<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISTEMA DO IMPÉRIO BLOQUEADO</title>

<link rel="stylesheet" href="estilo.css">
<script src="script.js"></script>

</head>
<body>

<!-- simbolo do imperio atras -->
<div id="fundo-imperio">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <g fill="#ff0000">
      <rect x="92" y="22" width="16" height="78" transform="rotate(0 100 100)"/>
      <rect x="92" y="22" width="16" height="78" transform="rotate(60 100 100)"/>
      <rect x="92" y="22" width="16" height="78" transform="rotate(120 100 100)"/>
      <rect x="92" y="22" width="16" height="78" transform="rotate(180 100 100)"/>
      <rect x="92" y="22" width="16" height="78" transform="rotate(240 100 100)"/>
      <rect x="92" y="22" width="16" height="78" transform="rotate(300 100 100)"/>
    </g>
    <circle cx="100" cy="100" r="72" fill="none" stroke="#ff0000" stroke-width="7"/>
    <circle cx="100" cy="100" r="26" fill="#000000" stroke="#ff0000" stroke-width="7"/>
  </svg>
</div>

<div id="terminal">
  <div id="cronometro">00:00</div>

  <div id="jogo">
    <h1>SISTEMA DO IMPÉRIO</h1>

    <div id="historia">
      O Império Galáctico bloqueou o sistema de notas da Academia.
      Descubra as senhas antes que o tempo acabe, rebelde.
    </div>

    <div id="fase-titulo">FASE 1</div>
    <div id="enunciado"></div>

    <div class="campo">
      <input type="text" id="senha" placeholder="Digite a senha..." autocomplete="off">
      <button onclick="verificar()">Testar</button>
    </div>

    <div id="mensagem"></div>

    <button onclick="mostrarDica()">Dica</button>
    <div id="dica"></div>

    <div id="conteudo-extra"></div>

    <button id="btn-fundo" onclick="alternarFundo()">Fundo: DESLIGADO</button>
  </div>

  <div id="tela-final">
    <div id="acesso-liberado">ACESSO LIBERADO</div>
    <div id="tempo-final"></div>
    <button onclick="reiniciar()">Jogar novamente</button>
  </div>
</div>

</body>
</html>
